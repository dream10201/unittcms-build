name: build

on:
  schedule:
    - cron: '0 10 * * 0'
  workflow_dispatch:
jobs:
  docker:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      packages: write
      contents: write
      attestations: write
    steps:
      - name: Checkout repository
        run: |
          git clone https://github.com/kimatata/unittcms.git
          mv unittcms/* ./
          ls -la
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.CR_PAT }}
      - name: Release and push (manual dispatch)
        if: ${{ github.event_name == 'workflow_dispatch' && github.ref_name == 'master' }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ghcr.io/dream10201/unittcms:latest
            docker.io/xiuxiu10201/unittcms:latest

      - name: Release and push (master branch)
        if: ${{ github.event_name != 'workflow_dispatch' && github.ref_name == 'master' }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ghcr.io/dream10201/unittcms:latest
            docker.io/xiuxiu10201/unittcms:latest
